services:
  - type: web
    name: property-maintenance-api
    env: node
    region: oregon
    buildCommand: cd backend && npm install
    startCommand: cd backend && node server.js
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: property-maintenance-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ORIGIN
        value: https://property-maintenance-web.onrender.com
      - key: PORT
        value: "10000"

  - type: web
    name: property-maintenance-web
    env: static
    buildCommand: cd frontend && npm install && npm run build
    staticPublishPath: frontend/build
    envVars:
      - key: REACT_APP_API_URL
        value: https://property-maintenance-api.onrender.com

databases:
  - name: property-maintenance-db
    region: oregon
    databaseName: property_maintenance
    user: app_user
    plan: free
